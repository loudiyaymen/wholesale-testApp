server {
  listen 80;
  root /usr/share/nginx/html;

  # proxy the api so the browser stays on one origin (no CORS setup needed)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # deep links like /customers/123 -> let angular's router handle it
  location / {
    try_files $uri $uri/ /index.html;
  }
}
